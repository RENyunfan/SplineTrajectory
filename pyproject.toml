[build-system]
requires = ["scikit-build-core>=0.9", "pybind11>=2.12"]
build-backend = "scikit_build_core.build"

[project]
name = "spline-trajectory"
version = "0.1.0"
description = "Spline trajectory optimization — fast C++ bindings for Cubic/Quintic/Septic MINCO splines"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
dependencies = ["numpy>=1.21"]

[project.optional-dependencies]
optimize = ["scipy>=1.7"]
dev = ["pytest>=7.0", "scipy>=1.7", "numpy>=1.21"]

[project.urls]
Homepage = "https://github.com/yunfan/SplineTrajectory"
Repository = "https://github.com/yunfan/SplineTrajectory"

[tool.scikit-build]
cmake.build-type = "Release"
cmake.args = ["-DSPLINE_BUILD_PYTHON=ON"]
wheel.packages = ["src/spline_trajectory"]
cmake.minimum-version = "3.18"
build-dir = "build/{wheel_tag}"

[tool.pytest.ini_options]
testpaths = ["tests"]
